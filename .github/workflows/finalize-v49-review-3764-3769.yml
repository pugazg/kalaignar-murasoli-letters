name: Finalize Volume 49 bilingual review 3764-3769

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-v49-review-3764-3769
          fetch-depth: 0
      - name: Apply and validate bilingual review batch
        run: python .github/v49-review-3764-3769/finalize.py
      - name: Commit reviewed batch to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Verify Volume 49 translations 3764-3769 by bilingual alignment" \
            -m "Compare six English translations directly with the complete canonical Tamil text, verify paragraph sequence, quotations, list items, names, dates, figures, attribution, rhetoric and political responsibility, apply four targeted English corrections without changing the Tamil source, add the batch review report, update statuses and progress, and remove all temporary staging files."
          git push origin HEAD:main
