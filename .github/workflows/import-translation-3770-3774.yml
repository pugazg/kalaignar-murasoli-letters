name: Recover translations 3770-3772

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'translation-import-3770-3774'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-import-3770-3774
          fetch-depth: 0

      - name: Recover complete entries from staged archive
        shell: bash
        run: |
          cat .translation-payload-3770-3774/chunk-*.txt > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.tar.gz
          set +e
          gzip -dc /tmp/payload.tar.gz > /tmp/payload.tar
          set -e

          mkdir -p /tmp/recovered
          set +e
          tar -xf /tmp/payload.tar -C /tmp/recovered --ignore-zeros \
            README.md \
            volumes/volume-49/README.md \
            volumes/volume-49/translations/en/GLOSSARY.md \
            volumes/volume-49/translations/en/PROGRESS.md \
            volumes/volume-49/translations/en/README.md \
            volumes/volume-49/translations/en/TEXTUAL_FIDELITY_AUDIT_3770_3774.md \
            volumes/volume-49/translations/en/letters/3770-are-we-to-become-like-a-lizard-that-has-lost-its-tail.md \
            volumes/volume-49/translations/en/letters/3771-is-she-seeking-the-title-coal-heroine.md \
            volumes/volume-49/translations/en/letters/3772-the-rajya-sabha-election-an-analysis.md
          set -e

          test "$(wc -c < /tmp/recovered/README.md)" -eq 3015
          test "$(wc -c < /tmp/recovered/volumes/volume-49/README.md)" -eq 5233
          test "$(wc -c < /tmp/recovered/volumes/volume-49/translations/en/GLOSSARY.md)" -eq 4610
          test "$(wc -c < /tmp/recovered/volumes/volume-49/translations/en/PROGRESS.md)" -eq 1419
          test "$(wc -c < /tmp/recovered/volumes/volume-49/translations/en/README.md)" -eq 3295
          test "$(wc -c < /tmp/recovered/volumes/volume-49/translations/en/TEXTUAL_FIDELITY_AUDIT_3770_3774.md)" -eq 1736
          test "$(wc -c < /tmp/recovered/volumes/volume-49/translations/en/letters/3770-are-we-to-become-like-a-lizard-that-has-lost-its-tail.md)" -eq 41005
          test "$(wc -c < /tmp/recovered/volumes/volume-49/translations/en/letters/3771-is-she-seeking-the-title-coal-heroine.md)" -eq 45859
          test "$(wc -c < /tmp/recovered/volumes/volume-49/translations/en/letters/3772-the-rajya-sabha-election-an-analysis.md)" -eq 59805

          cp -a /tmp/recovered/. .
          rm -rf .translation-payload-3770-3774
          rm -f .translation-trigger-3770-3774
          rm -f .github/workflows/import-translation-3770-3774.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover audited translations 3770-3772"
          git push origin HEAD:translation-import-3770-3774
