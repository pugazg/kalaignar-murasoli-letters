name: Temporary Volume 43 final page images

on:
  push:
    branches:
      - tmp-volume43-source-render

permissions:
  contents: read

jobs:
  render-final-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-volume43-source-render

      - name: Render cached PDF 371-402 as JPEG
        shell: bash
        run: |
          set -euo pipefail
          test -f tmp-source/volume43-pdf371-402.pdf
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p final-pages
          pdftoppm -f 1 -l 32 -jpeg -jpegopt quality=84 -r 100 tmp-source/volume43-pdf371-402.pdf final-pages/p >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          files=sorted(Path('final-pages').glob('p-*.jpg'))
          assert len(files)==32, len(files)
          for i,f in enumerate(files,371):
              f.rename(Path('final-pages')/f'page-{i}.jpg')
          PY
          du -sh final-pages

      - uses: actions/upload-artifact@v4
        with:
          name: volume43-final-pages-371-402
          path: final-pages/page-*.jpg
          compression-level: 6
          retention-days: 1
