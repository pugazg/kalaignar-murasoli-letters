name: Import translations 3770-3774

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'translation-import-3770-3774'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-import-3770-3774
          fetch-depth: 0

      - name: Diagnose staged translation payload
        shell: bash
        run: |
          wc -c .translation-payload-3770-3774/chunk-*.txt
          for f in .translation-payload-3770-3774/chunk-*.txt; do
            printf '%s first=' "$f"
            head -c 16 "$f"
            printf ' last='
            tail -c 16 "$f"
            printf '\n'
          done
          cat .translation-payload-3770-3774/chunk-*.txt > /tmp/payload.b64
          wc -c /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.tar.gz
          wc -c /tmp/payload.tar.gz
          sha256sum /tmp/payload.tar.gz
          gzip -t /tmp/payload.tar.gz
