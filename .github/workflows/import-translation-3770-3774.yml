name: Import translations 3770-3774

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'translation-import-3770-3774'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-import-3770-3774
          fetch-depth: 0

      - name: Decode and import audited translation batch
        shell: bash
        run: |
          cat .translation-payload-3770-3774/chunk-*.txt > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.tar.gz
          echo "Decoded payload: $(sha256sum /tmp/payload.tar.gz)"
          gzip -t /tmp/payload.tar.gz
          tar -tzf /tmp/payload.tar.gz
          tar -xzf /tmp/payload.tar.gz -C .

          rm -rf .translation-payload-3770-3774
          rm -f .translation-trigger-3770-3774
          rm -f .github/workflows/import-translation-3770-3774.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Translate Volume 49 letters 3770-3774 with scan fidelity audit"
          git push origin HEAD:translation-import-3770-3774
