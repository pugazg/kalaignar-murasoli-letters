name: Temporary Volume 43 source release

on:
  push:
    branches:
      - tmp-volume43-source-render

permissions:
  contents: write

jobs:
  publish-source-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-volume43-source-render

      - name: Publish cached PDF 371-402 as temporary release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f tmp-source/volume43-pdf371-402.pdf
          gh release delete tmp-v43-final-source-20260902 --cleanup-tag -y || true
          gh release create tmp-v43-final-source-20260902 \
            tmp-source/volume43-pdf371-402.pdf \
            --target tmp-volume43-source-render \
            --title "Temporary Volume 43 source slice 371-402" \
            --notes "Temporary source-verification asset. Remove after Volume 43 final-batch archival verification."
