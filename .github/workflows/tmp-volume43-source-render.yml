name: Temporary Volume 43 source render

on:
  push:
    branches:
      - tmp-volume43-source-render

permissions:
  contents: read

jobs:
  discover-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Discover current Tamil Digital Library source endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q requests beautifulsoup4 selenium
          python3 - <<'PY'
          import json, re, time
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup

          start = "https://www.tamildigitallibrary.in/book-detail.php?id=jZY9lup2kZl6TuXGlZQdjZU3jup2"
          r = requests.get(start, timeout=60, allow_redirects=True)
          print("HTTP", r.status_code, r.url, len(r.content), flush=True)
          text = r.text
          print("HTML 0065828 occurrences", text.count("0065828"), flush=True)
          for pat in [r'.{0,180}0065828.{0,300}', r'.{0,180}\.pdf.{0,300}', r'.{0,180}flipbook.{0,300}', r'.{0,180}single.{0,300}']:
              print("PATTERN", pat, flush=True)
              for m in re.finditer(pat, text, re.I | re.S):
                  print(re.sub(r'\s+', ' ', m.group(0))[:900], flush=True)

          soup = BeautifulSoup(text, "html.parser")
          for tag in soup.find_all(True):
              attrs = " ".join(f"{k}={v}" for k,v in tag.attrs.items())
              body = tag.get_text(" ", strip=True)
              hay = attrs + " " + body
              if any(x in hay.lower() for x in ["0065828", ".pdf", "flipbook", "படிக்க"]):
                  print("DOM", tag.name, attrs[:800], "TEXT", body[:300], flush=True)

          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.chrome.options import Options

          opts = Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--window-size=1600,1200")
          opts.set_capability("goog:loggingPrefs", {"performance": "ALL", "browser": "ALL"})
          driver = webdriver.Chrome(options=opts)
          try:
              driver.get(start)
              time.sleep(6)
              print("BROWSER_URL", driver.current_url, flush=True)
              print("TITLE", driver.title, flush=True)
              for el in driver.find_elements(By.XPATH, "//*[contains(normalize-space(.), 'படிக்க')]"):
                  try:
                      print("READ_ELEMENT", el.tag_name, el.get_attribute("outerHTML")[:1500], flush=True)
                  except Exception:
                      pass
              for el in driver.find_elements(By.XPATH, "//*[contains(@onclick, 'book') or contains(@onclick, 'Book') or contains(@onclick, 'flip') or contains(@onclick, 'pdf')]"):
                  try:
                      print("ONCLICK_ELEMENT", el.tag_name, el.get_attribute("outerHTML")[:2000], flush=True)
                  except Exception:
                      pass

              # Click the smallest visible element whose own text is exactly 'படிக்க'.
              candidates = driver.find_elements(By.XPATH, "//*[normalize-space(text())='படிக்க']")
              print("EXACT_READ_CANDIDATES", len(candidates), flush=True)
              for el in candidates[:5]:
                  try:
                      print("CANDIDATE", el.tag_name, el.get_attribute("outerHTML")[:1200], flush=True)
                      driver.execute_script("arguments[0].click();", el)
                      time.sleep(8)
                      print("AFTER_CLICK_URL", driver.current_url, "HANDLES", len(driver.window_handles), flush=True)
                      if len(driver.window_handles) > 1:
                          driver.switch_to.window(driver.window_handles[-1])
                          time.sleep(5)
                          print("POPUP_URL", driver.current_url, flush=True)
                      break
                  except Exception as exc:
                      print("CLICK_ERROR", repr(exc), flush=True)

              seen = set()
              for entry in driver.get_log("performance"):
                  try:
                      msg = json.loads(entry["message"])["message"]
                      if msg.get("method") != "Network.requestWillBeSent":
                          continue
                      url = msg["params"]["request"]["url"]
                  except Exception:
                      continue
                  low = url.lower()
                  if any(key in low for key in ["0065828", ".pdf", "assets/book", "flip", "reader", "singlepage", "book-detail", "book-details"]):
                      if url not in seen:
                          seen.add(url)
                          print("NETWORK", url, flush=True)
              for entry in driver.get_log("browser"):
                  print("BROWSER_LOG", entry, flush=True)
          finally:
              driver.quit()
          PY
