name: Audit Volume 46 Editorial Consistency

on:
  push:
    paths:
      - '.github/workflows/audit-volume46-editorial.yml'

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply editorial consistency fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          d = root / 'volumes/volume-46/translations/en/letters'
          files = sorted(d.glob('*.md'))
          assert len(files) == 55
          for fn in ['3605-the-moving-temple-renovation-we-began.md','3607-they-were-stunned-all-right.md']:
              p=d/fn
              s=p.read_text(encoding='utf-8')
              s=s.replace('This draft follows the locked Volume 46 conventions.','This verified translation follows the locked Volume 46 conventions.',1)
              s=s.replace('This draft awaits a separate bilingual source-alignment review.','The English translation has passed bilingual source-alignment review against the audited Tamil and source pages.',1)
              p.write_text(s,encoding='utf-8')
          problems=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              if 'translation_status: "verified"' not in s or 'bilingual_alignment_status: "verified"' not in s: problems.append(p.name+':status')
              if '> **Translator’s note**' not in s: problems.append(p.name+':note')
              if '## Original Tamil — மூலத் தமிழ்' not in s: problems.append(p.name+':tamil')
              if 'This draft awaits bilingual source-alignment review.' in s or 'This draft awaits a separate bilingual source-alignment review.' in s: problems.append(p.name+':stale')
              fm=s.split('---',2)[1]
              m1=re.search(r'^english_title:\s*"(.*)"\s*$',fm,re.M)
              m2=re.search(r'^#\s+\d+\.\s+(.+)$',s,re.M)
              if m1 and m2 and m1.group(1)!=m2.group(1).strip(): problems.append(p.name+':title')
          assert not problems, problems
          mp=root/'volumes/volume-46/metadata.yml'
          s=mp.read_text(encoding='utf-8')
          s=s.replace('draft_alignment_pending_range: "3648-3649"','draft_alignment_pending_range: null')
          s=s.replace('english_release_status: "editorial-review-pending"','editorial_consistency_review_status: "complete"\nenglish_release_status: "editorial-review-complete"')
          mp.write_text(s,encoding='utf-8')
          pp=root/'volumes/volume-46/translations/en/PROGRESS.md'
          s=pp.read_text(encoding='utf-8')
          s=s.replace('- [ ] Editorial consistency review','- [x] Editorial consistency review')
          s=s.replace('Begin the **volume-level editorial consistency review** across all 55 verified English bilingual records. After that, build the translation manifest and final English release report.','Build the **translation manifest** for all 55 verified English records, then prepare the final English release report.')
          pp.write_text(s,encoding='utf-8')
          rp=root/'volumes/volume-46/translations/en/README.md'
          s=rp.read_text(encoding='utf-8')
          s=s.replace('**Exact next task:** begin the **volume-level editorial consistency review** across all 55 verified English bilingual records, followed by the translation manifest and final English release report.','**Editorial consistency review:** complete across all 55 verified bilingual records.\n\n**Exact next task:** build the **translation manifest** for all 55 records, then prepare the final English release report.')
          rp.write_text(s,encoding='utf-8')
          PY
      - name: Commit editorial consistency fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volumes/volume-46/translations/en/letters/3605-the-moving-temple-renovation-we-began.md volumes/volume-46/translations/en/letters/3607-they-were-stunned-all-right.md volumes/volume-46/translations/en/PROGRESS.md volumes/volume-46/translations/en/README.md volumes/volume-46/metadata.yml
          git commit -m "Apply Volume 46 editorial consistency fixes"
          git push
