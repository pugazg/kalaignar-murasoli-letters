name: Export Volume 49 bilingual review batch 3770-3774

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect review sources
        run: |
          mkdir -p review-source/letters
          cp volumes/volume-49/TRANSLATION_PLAN.md review-source/
          cp volumes/volume-49/translations/en/PROGRESS.md review-source/
          cp volumes/volume-49/translations/en/README.md review-source/EN_README.md
          cp volumes/volume-49/translations/en/GLOSSARY.md review-source/
          cp volumes/volume-49/translations/en/letters/3770-are-we-to-become-like-a-lizard-that-has-lost-its-tail.md review-source/letters/
          cp volumes/volume-49/translations/en/letters/3771-is-she-seeking-the-title-coal-heroine.md review-source/letters/
          cp volumes/volume-49/translations/en/letters/3772-the-rajya-sabha-election-an-analysis.md review-source/letters/
          cp volumes/volume-49/translations/en/letters/3773-let-us-raise-our-voice-for-people-of-every-caste-to-become-priests.md review-source/letters/
          cp volumes/volume-49/translations/en/letters/3774-does-tamil-not-deserve-the-right-that-hindi-has.md review-source/letters/
      - uses: actions/upload-artifact@v4
        with:
          name: v49-review-3770-3774-source
          path: review-source
