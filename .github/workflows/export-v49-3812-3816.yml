name: Export Volume 49 source pages 3812-3816
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/v49-3812-3816/export-trigger.txt'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble source bundle
        run: |
          mkdir -p export/pages export/chapters export/meta
          cp volumes/volume-49/pages/page-{365..402}.md export/pages/
          cp volumes/volume-49/chapters/381{2,3,4,5,6}-*.md export/chapters/
          cp README.md export/meta/ROOT_README.md
          cp volumes/volume-49/README.md export/meta/VOLUME_README.md
          cp volumes/volume-49/translations/en/README.md export/meta/EN_README.md
          cp volumes/volume-49/translations/en/PROGRESS.md export/meta/PROGRESS.md
          cp volumes/volume-49/translations/en/GLOSSARY.md export/meta/GLOSSARY.md
      - uses: actions/upload-artifact@v4
        with:
          name: v49-3812-3816-source
          path: export
