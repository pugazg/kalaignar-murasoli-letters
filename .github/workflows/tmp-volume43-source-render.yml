name: Temporary Volume 43 page-image cache

on:
  push:
    branches:
      - tmp-volume43-source-render

permissions:
  contents: write
  actions: read

jobs:
  cache-page-images:
    if: ${{ !contains(github.event.head_commit.message, '[image-cache]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-volume43-source-render

      - name: Download verified source-render artifact
        uses: actions/download-artifact@v4
        with:
          name: volume43-pdf257-279-verification
          path: source-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: pugazg/kalaignar-murasoli-letters
          run-id: 33521909357

      - name: Cache readable temporary page images on the temp branch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path('source-artifact/rendered')
          dst = Path('tmp-source/rendered')
          dst.mkdir(parents=True, exist_ok=True)
          images = sorted(src.glob('*.jpg'))
          assert len(images) == 23, len(images)
          for p in images:
              im = Image.open(p).convert('RGB')
              maxw = 1500
              if im.width > maxw:
                  h = round(im.height * maxw / im.width)
                  im = im.resize((maxw, h), Image.Resampling.LANCZOS)
              out = dst / p.name
              im.save(out, 'JPEG', quality=90, optimize=True, progressive=True)
              print(out, out.stat().st_size)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-source/rendered/*.jpg
          git commit -m "Temporary: cache Volume 43 page images 257-279 [image-cache]"
          git push origin HEAD:tmp-volume43-source-render
