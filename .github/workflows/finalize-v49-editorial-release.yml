name: Finalize Volume 49 English editorial release

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: stage-v49-editorial-release
          path: source
          fetch-depth: 0
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0
      - name: Copy finalizer into main worktree
        run: |
          mkdir -p repo/.github/v49-editorial-release
          cp source/.github/v49-editorial-release/finalize.py repo/.github/v49-editorial-release/finalize.py
      - name: Apply and validate editorial release
        working-directory: repo
        run: python .github/v49-editorial-release/finalize.py
      - name: Commit editorial release to main
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Volume 49 English editorial release" \
            -m "Run the volume-level editorial consistency pass across all 53 verified translations; standardize eight English files without changing canonical Tamil; add the translation manifest, editorial QA report and final release report; update indexes, glossary and progress; validate all release invariants; and remove temporary staging material."
          git push origin HEAD:main
