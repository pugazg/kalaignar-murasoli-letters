name: Release Volume 46 English Edition
on:
  push:
    paths:
      - .github/workflows/release-volume46-english.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release package
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, re
          base=Path('volumes/volume-46/translations/en')
          files=sorted((base/'letters').glob('*.md'))
          assert len(files)==55
          def val(s,k):
              fm=s.split('---',2)[1]
              m=re.search(r'^'+re.escape(k)+r':\s*(.*)$',fm,re.M)
              v=m.group(1).strip() if m else ''
              if len(v)>=2 and v[0]==v[-1] and v[0] in ('"',"'"): v=v[1:-1]
              return v
          def report(n):
              n=int(n)
              groups=[(3592,3594,'3592_3594'),(3595,3599,'3595_3599'),(3600,3604,'3600_3604'),(3605,3609,'3605_3609'),(3610,3614,'3610_3614'),(3615,3619,'3615_3619'),(3620,3624,'3620_3624'),(3625,3629,'3625_3629'),(3630,3634,'3630_3634')]
              for a,b,x in groups:
                  if a<=n<=b:return '../BILINGUAL_ALIGNMENT_REVIEW_'+x+'.md'
              if n in (3635,3637,3638,3639):return '../BILINGUAL_ALIGNMENT_REVIEW_3635_3639.md'
              if n in (3640,3641,3642,3643,3647):return '../BILINGUAL_ALIGNMENT_REVIEW_3640_3647.md'
              if n in (3648,3649):return '../BILINGUAL_ALIGNMENT_REVIEW_3648_3649.md'
              raise AssertionError(n)
          rows=[]; total=0; nums=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              assert 'translation_status: "verified"' in s and 'bilingual_alignment_status: "verified"' in s
              assert '## Original Tamil — மூலத் தமிழ்' in s and '> **Translator’s note**' in s
              n=val(s,'letter_number'); nums.append(int(n))
              pre=s.split('## Original Tamil — மூலத் தமிழ்',1)[0]
              if '## English translation' in pre: body=pre.split('## English translation',1)[1]
              else:
                  body=pre.split('**Date:**',1)[1] if '**Date:**' in pre else pre.split('---',2)[-1]
              wc=len(re.findall(r"\b[\w’'-]+\b",body,re.UNICODE)); total+=wc
              rows.append([n,val(s,'date'),val(s,'english_title'),val(s,'tamil_title'),val(s,'source_pdf_page_start')+'-'+val(s,'source_pdf_page_end'),val(s,'source_printed_page_start')+'-'+val(s,'source_printed_page_end'),val(s,'translation_status'),val(s,'bilingual_alignment_status'),val(s,'source_textual_fidelity_audit'),wc,'letters/'+p.name,report(n)])
          assert len(rows)==55 and nums.count(3637)==2 and 3636 not in nums and all(x not in nums for x in (3644,3645,3646))
          out=io.StringIO(newline=''); w=csv.writer(out,lineterminator='\n')
          w.writerow(['letter_number','date','english_title','tamil_title','source_pdf_pages','source_printed_pages','translation_status','bilingual_alignment_status','source_textual_fidelity_audit','english_word_count','file','bilingual_alignment_report']); w.writerows(rows)
          (base/'TRANSLATION_MANIFEST.csv').write_text(out.getvalue(),encoding='utf-8')
          report_text=f'''# Volume 46 English Translation — Final Release Report

## Release identity

- Work: **Kalaignar’s Murasoli Letters — Volume 46**
- Source numbering span: **3592–3649**, with source anomalies preserved
- Actual source-letter records: **55**
- Letter dates: **5 October 2011–15 August 2012**
- Source PDF: **402 pages**
- Translated letter-page span: **PDF 24–400**
- English letters released: **55**
- Editorial English word count: **{total:,}**

## Completion status

| Stage | Result |
|---|---:|
| Tamil page-level transcription | Complete |
| Full-volume Tamil structural audit | Complete |
| Second visual/textual-fidelity gate | Complete |
| English translation | 55/55 |
| Source checking | 55/55 |
| Bilingual alignment verification | 55/55 |
| Volume-level English editorial review | Complete |
| Translation manifest | 55 rows |
| Canonical Tamil changed during English editorial review | 0 |

## Release contents

- [`README.md`](README.md) — English translation status and access point
- [`letters/`](letters/) — one verified bilingual Markdown file per actual source record
- [`TRANSLATION_MANIFEST.csv`](TRANSLATION_MANIFEST.csv) — machine-readable metadata for all 55 records
- [`EDITORIAL_CONSISTENCY_REVIEW.md`](EDITORIAL_CONSISTENCY_REVIEW.md) — volume-level editorial QA record
- `BILINGUAL_ALIGNMENT_REVIEW_*.md` — substantive Tamil–English review reports
- `TEXTUAL_FIDELITY_AUDIT_*.md` — scan-to-Markdown source audits
- [`PILOT_TRANSLATION_CONVENTIONS.md`](PILOT_TRANSLATION_CONVENTIONS.md) — locked translation conventions

## Editorial and archival policy

The released English is a thought-preserving, non-literary translation. It retains Kalaignar’s argument order, political directness, criticism, irony, repetition, rhetorical questions, source-specific figures and quoted voices. The complete audited Tamil source is appended to every bilingual record and remains authoritative.

The source numbering is not repaired. There is **no 3636**; the scan prints **two distinct consecutive 3637 records**; and there are **no 3644–3646 source records**. Known contents-page versus actual-heading distinctions are likewise preserved rather than silently normalised.

## QA summary

The final editorial pass found only two stale translator-note status phrases (3605 and 3607) plus one stale metadata pending-range field. Those were corrected without changing substantive English. No political meaning, attribution, uncertainty, figures, quotations or canonical Tamil was altered by the editorial pass.

Release status: **ready as the completed English edition of Volume 46 in this repository**.
'''
          (base/'RELEASE_REPORT.md').write_text(report_text,encoding='utf-8')
          p=base/'PROGRESS.md'; s=p.read_text(encoding='utf-8').replace('- [ ] Translation manifest and final English release report','- [x] Translation manifest and final English release report')
          if '## Release status' not in s:s+='\n\n## Release status\n\n**Volume 46 English edition complete and release-ready: 55 / 55 verified bilingual records.**\n'
          p.write_text(s,encoding='utf-8')
          p=base/'README.md'; s=p.read_text(encoding='utf-8').replace('Status: **all 55 actual source-letter records have structurally complete English bilingual files and all 55 are source-checked and bilingual-alignment verified**.','Status: **English edition complete and release-ready: all 55 actual source-letter records are structurally complete, source-checked, bilingual-alignment verified and editorially reviewed**.').replace('**Exact next task:** build the **translation manifest** for all 55 records, then prepare the final English release report.','**Release:** [`TRANSLATION_MANIFEST.csv`](TRANSLATION_MANIFEST.csv) and [`RELEASE_REPORT.md`](RELEASE_REPORT.md) complete the Volume 46 English release package.')
          p.write_text(s,encoding='utf-8')
          p=Path('volumes/volume-46/metadata.yml'); s=p.read_text(encoding='utf-8').replace('english_release_status: "editorial-review-complete"','english_release_status: "released"')
          if 'translation_manifest_rows:' not in s:s=s.replace('english_release_status: "released"','english_release_status: "released"\ntranslation_manifest_rows: 55\neditorial_english_word_count: '+str(total))
          p.write_text(s,encoding='utf-8')
          check=list(csv.DictReader((base/'TRANSLATION_MANIFEST.csv').read_text(encoding='utf-8').splitlines())); assert len(check)==55 and sum(int(r['english_word_count']) for r in check)==total
          print('manifest_rows=55 editorial_english_word_count='+str(total))
          PY
      - name: Commit release package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volumes/volume-46/translations/en/TRANSLATION_MANIFEST.csv volumes/volume-46/translations/en/RELEASE_REPORT.md volumes/volume-46/translations/en/PROGRESS.md volumes/volume-46/translations/en/README.md volumes/volume-46/metadata.yml
          git commit -m "Release Volume 46 English translation"
          git push
