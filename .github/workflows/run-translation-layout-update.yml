name: Run translation layout update

on:
  push:
    branches: [main]
    paths:
      - '.translation-layout-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply translation layout
        run: python .github/scripts/apply_translation_layout.py
      - name: Commit update and clean temporary files
        shell: bash
        run: |
          rm -f .translation-layout-trigger
          rm -f .github/scripts/apply_translation_layout.py
          rm -f .github/workflows/run-translation-layout-update.yml
          rm -f .github/workflows/apply-translation-note-and-tamil.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Standardize translator note and include full Tamil source"
          git push origin HEAD:main
