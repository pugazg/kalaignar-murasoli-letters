name: Export Volume 49 for audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-audit.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build chunked repository export
        shell: bash
        run: |
          rm -rf .audit-export
          mkdir -p .audit-export
          tar -czf /tmp/volume49-repo.tar.gz README.md TRANSCRIPTION_GUIDE.md volumes/volume-49
          base64 -w 0 /tmp/volume49-repo.tar.gz | fold -w 60000 | split -d -a 3 - .audit-export/part-
          sha256sum /tmp/volume49-repo.tar.gz > .audit-export/SHA256SUMS
          printf '%s\n' .audit-export/part-* | sed 's#^#- #' > .audit-export/MANIFEST.md
          rm -f .github/workflows/export-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Export Volume 49 repository for full audit"
          git push origin HEAD:main
