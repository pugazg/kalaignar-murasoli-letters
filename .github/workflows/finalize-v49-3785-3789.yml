name: Finalize Volume 49 translations 3785-3789

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/v49-3785-3789/finalize-trigger.txt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode and run audited batch finalizer
        run: |
          base64 -d .github/v49-3785-3789/finalize.py.gz.b64 | gzip -dc > /tmp/finalize-v49-3785-3789.py
          python /tmp/finalize-v49-3785-3789.py

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Translate Volume 49 letters 3785-3789 with scan fidelity audit" -m "Add source-checked English translations for letters 3785–3789 after visually comparing all 34 canonical Tamil Markdown pages (PDF 169–202) with their scans. Apply and document ten scan-verified spacing, word-boundary, quotation-mark or grammatical-sandhi corrections. Append the complete corrected authoritative Tamil source to every bilingual file, update the English index, glossary, progress record and repository summaries, and remove temporary export and staging files."
          git push origin main
