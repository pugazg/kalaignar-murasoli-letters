name: Finalize Volume 49 transcription

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-volume49.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract final transcription batch
        shell: bash
        run: |
          cat .volume49-payload/part-*.txt > /tmp/volume49-final.b64
          base64 --decode /tmp/volume49-final.b64 > /tmp/volume49-final.tar.gz
          tar -xzf /tmp/volume49-final.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .volume49-payload
          rm -f .github/workflows/finalize-volume49.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add volume 49 letters 3812-3816 and complete first pass"
          git push origin HEAD:main
