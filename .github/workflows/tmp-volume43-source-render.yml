name: Temporary Volume 43 source slice

on:
  push:
    branches:
      - tmp-volume43-source-render

permissions:
  contents: read

jobs:
  slice-active-range:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Fetch and verify controlling source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import requests
          url = "https://tamildigitallibrary.in/assets/docs/uploads/primary_files/book/TVA_BOK_0065828/TVA_BOK_0065828_கலைஞரின்_கடிதங்கள்_தொகுதி_43.pdf"
          out = Path("source.pdf")
          h = hashlib.sha256(); size = 0
          with requests.get(url, stream=True, timeout=180, allow_redirects=True) as r:
              r.raise_for_status()
              with out.open("wb") as f:
                  for chunk in r.iter_content(chunk_size=1024*1024):
                      if not chunk: continue
                      f.write(chunk); h.update(chunk); size += len(chunk)
          assert size == 229557034, size
          assert h.hexdigest() == "53607130844a56b7b65b7dc5451031a33690c867e81c5ffab6e9b70958fdaf35"
          print("verified", size, h.hexdigest())
          PY

      - name: Extract PDF 279-315
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          test "$(pdfinfo source.pdf | awk -F: '/^Pages:/ {gsub(/ /, "", $2); print $2}')" = "402"
          qpdf source.pdf --pages . 279-315 -- active-range-pdf279-315.pdf
          pdfinfo active-range-pdf279-315.pdf | tee pdfinfo.txt
          test "$(pdfinfo active-range-pdf279-315.pdf | awk -F: '/^Pages:/ {gsub(/ /, "", $2); print $2}')" = "37"

      - name: Upload source slice
        uses: actions/upload-artifact@v4
        with:
          name: volume43-pdf279-315-slice
          path: |
            active-range-pdf279-315.pdf
            pdfinfo.txt
          if-no-files-found: error
          retention-days: 1
