name: Temporary Volume 43 lightweight verification images

on:
  push:
    branches:
      - tmp-volume43-source-render

permissions:
  contents: read

jobs:
  render-lite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-volume43-source-render

      - name: Render PDF 279-315 as compact JPEGs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          mkdir -p lite-pages
          pdftoppm -f 1 -l 37 -jpeg -jpegopt quality=72 -r 120 tmp-source/volume43-pdf279-315.pdf lite-pages/p >/dev/null 2>&1
          python3 - <<'PY'
          from pathlib import Path
          files=sorted(Path('lite-pages').glob('p-*.jpg'))
          assert len(files)==37, len(files)
          for i,f in enumerate(files,279):
              f.rename(Path('lite-pages')/f'page-{i}.jpg')
          print('rendered', len(files), 'pages')
          PY
          du -sh lite-pages

      - uses: actions/upload-artifact@v4
        with:
          name: volume43-pdf279-315-lite-jpg
          path: lite-pages/page-*.jpg
          compression-level: 6
          retention-days: 1
