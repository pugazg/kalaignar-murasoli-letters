name: Promote Volume 46 Batch 10

on:
  push:
    paths:
      - '.github/workflows/promote-volume46-batch10.yml'

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote Batch 10 and synchronize tracking
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          letters = [
              root / 'volumes/volume-46/translations/en/letters/3640-what-is-happening-in-tamil-nadu.md',
              root / 'volumes/volume-46/translations/en/letters/3641-do-not-create-perversity-by-calling-it-confusion.md',
              root / 'volumes/volume-46/translations/en/letters/3642-murasoli-circulation-must-grow-threefold.md',
              root / 'volumes/volume-46/translations/en/letters/3643-all-i-myself-is-not-a-path-good-people-praise.md',
              root / 'volumes/volume-46/translations/en/letters/3647-come-let-us-remove-the-suffering-of-eelam-tamils.md',
          ]
          for path in letters:
              s = path.read_text(encoding='utf-8')
              assert s.count('translation_status: "draft-translated"') == 1, path
              assert s.count('bilingual_alignment_status: "pending"') == 1, path
              assert 'This draft follows the locked Volume 46 conventions.' in s, path
              assert 'This draft awaits bilingual source-alignment review.' in s, path
              s = s.replace('translation_status: "draft-translated"', 'translation_status: "verified"', 1)
              s = s.replace('bilingual_alignment_status: "pending"', 'bilingual_alignment_status: "verified"', 1)
              s = s.replace('This draft follows the locked Volume 46 conventions.', 'This verified translation follows the locked Volume 46 conventions.', 1)
              s = s.replace('This draft awaits bilingual source-alignment review.', 'The English translation has passed bilingual source-alignment review against the audited Tamil and source pages.', 1)
              path.write_text(s, encoding='utf-8')

          progress = root / 'volumes/volume-46/translations/en/PROGRESS.md'
          s = progress.read_text(encoding='utf-8')
          s = s.replace('- [ ] Promote Batch 10 records to verified / verified and synchronize tracking', '- [x] Main translation batch 10: 3640, 3641, 3642, 3643, 3647 verified')
          s = s.replace('- Structurally complete verified bilingual records: **48 / 55 actual source records**', '- Structurally complete verified bilingual records: **53 / 55 actual source records**')
          s = s.replace('- Draft-translated / bilingual-alignment pending: **5 / 55 actual source records**', '- Draft-translated / bilingual-alignment pending: **0 / 55 actual source records**')
          s = s.replace('- Verified source coverage: **3592–3635; 3637 (two distinct source records); 3638–3639**', '- Verified source coverage: **3592–3635; 3637 (two distinct source records); 3638–3643; 3647**')
          s = s.replace('## Batch 10 — ALIGNMENT REVIEW COMPLETE', '## Batch 10 — VERIFIED COMPLETE')
          s = s.replace('## Exact next task\n\nPromote **3640, 3641, 3642, 3643 and 3647 together** from `draft-translated / pending` to `verified / verified`, change their translator notes from draft wording to completed source-alignment wording, and synchronize the English README, Volume 46 metadata and this progress file. After that, only the final two actual source records remain to be translated.', '## Exact next task\n\nDraft the final two actual source records, **3648 and 3649**, in scan order. Embed complete audited Tamil appendices and translator-note blocks from creation, leave both at `draft-translated / pending`, and then perform their final bilingual source-alignment gate before the volume-level editorial consistency review and English release work.')
          progress.write_text(s, encoding='utf-8')

          readme = root / 'volumes/volume-46/translations/en/README.md'
          s = readme.read_text(encoding='utf-8')
          s = s.replace('Status: **main translation in progress; 48 English files exist and all 48 are source-checked, structurally complete and bilingual-alignment verified**.', 'Status: **main translation in progress; 53 English files exist and all 53 are source-checked, structurally complete and bilingual-alignment verified**.')
          s = s.replace('- **Batch 9 actual source order: 3635; 3637 (first); 3637 (second); 3638; 3639** — verified, covering PDF **329–355**.', '- **Batch 9 actual source order: 3635; 3637 (first); 3637 (second); 3638; 3639** — verified, covering PDF **329–355**.\n- **Batch 10 actual source order: 3640; 3641; 3642; 3643; 3647** — verified, covering PDF **356–387**.')
          s = s.replace('**English files: 48 / 55.**', '**English files: 53 / 55.**')
          s = s.replace('**Structurally complete verified bilingual records: 48 / 55 actual source records.**', '**Structurally complete verified bilingual records: 53 / 55 actual source records.**')
          s = s.replace('[Batch 9](BILINGUAL_ALIGNMENT_REVIEW_3635_3639.md). The closed structural regression', '[Batch 9](BILINGUAL_ALIGNMENT_REVIEW_3635_3639.md), [Batch 10](BILINGUAL_ALIGNMENT_REVIEW_3640_3647.md). The closed structural regression')
          s = s.replace('**Exact next task:** draft the next five **actual source records** in scan order: **3640, 3641, 3642, 3643, 3647**. Preserve the jump after 3643 and do not invent 3644–3646. Embed complete audited Tamil and translator notes from creation; leave the new records draft/pending until their separate bilingual source-alignment gate.', '**Exact next task:** draft the final two actual source records, **3648 and 3649**, in scan order. Embed complete audited Tamil and translator notes from creation; leave both draft/pending until their final bilingual source-alignment gate.')
          readme.write_text(s, encoding='utf-8')

          metadata = root / 'volumes/volume-46/metadata.yml'
          s = metadata.read_text(encoding='utf-8')
          s = s.replace('translated_letter_range: "3592-3635; 3637 (two source records); 3638-3639"', 'translated_letter_range: "3592-3635; 3637 (two source records); 3638-3643; 3647"')
          s = s.replace('translated_letter_count: 48', 'translated_letter_count: 53')
          s = s.replace('source_checked_letter_count: 48', 'source_checked_letter_count: 53')
          s = s.replace('verified_translation_count: 48', 'verified_translation_count: 53')
          s = s.replace('structurally_complete_verified_count: 48', 'structurally_complete_verified_count: 53')
          s = s.replace('structurally_complete_verified_range: "3592-3635; 3637 (two source records); 3638-3639"', 'structurally_complete_verified_range: "3592-3635; 3637 (two source records); 3638-3643; 3647"')
          s = s.replace('bilingual_alignment_reviewed_range: "3592-3635; 3637 (two source records); 3638-3639"', 'bilingual_alignment_reviewed_range: "3592-3635; 3637 (two source records); 3638-3643; 3647"')
          s = s.replace('bilingual_alignment_verified_range: "3592-3635; 3637 (two source records); 3638-3639"', 'bilingual_alignment_verified_range: "3592-3635; 3637 (two source records); 3638-3643; 3647"')
          old = '  - "Next translation batch must follow actual source order: 3640, 3641, 3642, 3643, 3647; no 3644-3646 are to be invented."'
          new = '  - "Tenth five-record translation batch is source-checked and bilingual-alignment verified in actual source order: 3640, 3641, 3642, 3643, 3647, covering PDF 356-387."\n  - "Batch 10 required no substantive English correction and caused no canonical Tamil changes; all five bilingual records contain complete audited Tamil appendices."\n  - "The final translation batch consists of the two actual source records 3648 and 3649."'
          assert old in s
          s = s.replace(old, new)
          metadata.write_text(s, encoding='utf-8')
      - name: Commit promoted records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volumes/volume-46/translations/en/letters/3640-what-is-happening-in-tamil-nadu.md \
                  volumes/volume-46/translations/en/letters/3641-do-not-create-perversity-by-calling-it-confusion.md \
                  volumes/volume-46/translations/en/letters/3642-murasoli-circulation-must-grow-threefold.md \
                  volumes/volume-46/translations/en/letters/3643-all-i-myself-is-not-a-path-good-people-praise.md \
                  volumes/volume-46/translations/en/letters/3647-come-let-us-remove-the-suffering-of-eelam-tamils.md \
                  volumes/volume-46/translations/en/PROGRESS.md \
                  volumes/volume-46/translations/en/README.md \
                  volumes/volume-46/metadata.yml
          git commit -m "Promote Volume 46 Batch 10 translations"
          git push
