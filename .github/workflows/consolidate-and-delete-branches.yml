name: Consolidate and delete non-main branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/consolidate-and-delete-branches.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge unique branch work, delete branches, and remove this workflow
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

          mapfile -t branches < <(
            git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
              | grep -vE '^(HEAD|main)$' \
              | sort
          )

          echo "Found ${#branches[@]} non-main branches."
          printf '%s\n' "${branches[@]}"

          git checkout -B integration origin/main

          for branch in "${branches[@]}"; do
            if git merge-base --is-ancestor "origin/${branch}" HEAD; then
              echo "Already contained in main: ${branch}"
            else
              echo "Merging unique commits from: ${branch}"
              git merge --no-edit --no-ff "origin/${branch}" \
                -m "Merge branch '${branch}' before repository branch cleanup"
            fi
          done

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          else
            echo "No branch contained commits outside main; no merge commit required."
          fi

          for branch in "${branches[@]}"; do
            echo "Deleting remote branch: ${branch}"
            git push origin --delete "${branch}"
          done

          git fetch origin main
          git checkout -B main origin/main
          git rm .github/workflows/consolidate-and-delete-branches.yml
          git commit -m "Remove temporary branch cleanup workflow"
          git push origin main
