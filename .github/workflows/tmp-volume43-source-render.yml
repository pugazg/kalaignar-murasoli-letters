name: Temporary Volume 43 source cache

on:
  push:
    branches:
      - tmp-volume43-source-render

permissions:
  contents: write
  actions: read

jobs:
  cache-active-range:
    if: ${{ !contains(github.event.head_commit.message, '[source-cache]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-volume43-source-render

      - name: Download verified source-render artifact
        uses: actions/download-artifact@v4
        with:
          name: volume43-pdf257-279-verification
          path: source-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: pugazg/kalaignar-murasoli-letters
          run-id: 33521909357

      - name: Cache only the temporary verification PDF and OCR on the temp branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp-source
          cp source-artifact/active-range-pdf257-279.pdf tmp-source/volume43-pdf257-279.pdf
          cp source-artifact/ocr/combined.txt tmp-source/volume43-pdf257-279-ocr.txt
          cp source-artifact/pdfinfo.txt tmp-source/volume43-pdf257-279-info.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-source/volume43-pdf257-279.pdf tmp-source/volume43-pdf257-279-ocr.txt tmp-source/volume43-pdf257-279-info.txt
          git commit -m "Temporary: cache Volume 43 PDF 257-279 [source-cache]"
          git push origin HEAD:tmp-volume43-source-render
