name: Export Volume 49 bilingual review batch 3764-3769

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect review sources
        run: |
          mkdir -p review-source/letters
          cp volumes/volume-49/TRANSLATION_PLAN.md review-source/
          cp volumes/volume-49/translations/en/PROGRESS.md review-source/
          cp volumes/volume-49/translations/en/README.md review-source/EN_README.md
          cp volumes/volume-49/translations/en/GLOSSARY.md review-source/
          cp volumes/volume-49/translations/en/letters/3764-what-was-left-out-of-the-list-of-achievements.md review-source/letters/
          cp volumes/volume-49/translations/en/letters/3765-i-will-work-i-will-keep-working.md review-source/letters/
          cp volumes/volume-49/translations/en/letters/3766-will-the-government-of-india-continue-to-sleep.md review-source/letters/
          cp volumes/volume-49/translations/en/letters/3767-should-there-not-be-conduct-befitting-the-office.md review-source/letters/
          cp volumes/volume-49/translations/en/letters/3768-it-is-among-people-like-these-that.md review-source/letters/
          cp volumes/volume-49/translations/en/letters/3769-some-of-the-charitable-work-carried-out-by-the-dmk.md review-source/letters/
      - uses: actions/upload-artifact@v4
        with:
          name: v49-review-3764-3769-source
          path: review-source
