name: Import translations 3770-3774

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'translation-import-3770-3774'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-import-3770-3774
          fetch-depth: 0

      - name: Inspect recoverable translation archive entries
        shell: bash
        run: |
          cat .translation-payload-3770-3774/chunk-*.txt > /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.tar.gz
          set +e
          gzip -dc /tmp/payload.tar.gz > /tmp/payload.tar
          gzip_status=$?
          set -e
          echo "gzip status: $gzip_status"
          wc -c /tmp/payload.tar
          echo 'Recoverable tar entries:'
          tar -tvf /tmp/payload.tar --ignore-zeros || true
