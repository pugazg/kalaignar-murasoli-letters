name: Temporary Volume 43 PDF slice cache

on:
  push:
    branches:
      - tmp-volume43-source-render

permissions:
  contents: write

jobs:
  cache-pdf-slice:
    if: ${{ !contains(github.event.head_commit.message, '[pdf-slice]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-volume43-source-render

      - name: Fetch verified controlling source and cache PDF 279-315
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import requests
          url = "https://tamildigitallibrary.in/assets/docs/uploads/primary_files/book/TVA_BOK_0065828/TVA_BOK_0065828_கலைஞரின்_கடிதங்கள்_தொகுதி_43.pdf"
          out = Path("/tmp/volume43.pdf")
          h = hashlib.sha256(); size = 0
          with requests.get(url, stream=True, timeout=180, allow_redirects=True) as r:
              r.raise_for_status()
              with out.open("wb") as f:
                  for chunk in r.iter_content(chunk_size=1024*1024):
                      if not chunk:
                          continue
                      f.write(chunk); h.update(chunk); size += len(chunk)
          assert size == 229557034, size
          assert h.hexdigest() == "53607130844a56b7b65b7dc5451031a33690c867e81c5ffab6e9b70958fdaf35"
          print("verified", size, h.hexdigest())
          PY
          sudo apt-get update -qq
          sudo apt-get install -y -qq qpdf poppler-utils
          mkdir -p tmp-source
          qpdf /tmp/volume43.pdf --pages . 279-315 -- tmp-source/volume43-pdf279-315.pdf
          test "$(pdfinfo tmp-source/volume43-pdf279-315.pdf | awk -F: '/^Pages:/ {gsub(/ /, "", $2); print $2}')" = "37"
          ls -lh tmp-source/volume43-pdf279-315.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-source/volume43-pdf279-315.pdf
          git commit -m "Temporary: cache Volume 43 PDF 279-315 [pdf-slice]"
          git push origin HEAD:tmp-volume43-source-render
