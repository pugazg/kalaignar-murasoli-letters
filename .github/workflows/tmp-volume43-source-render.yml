name: Temporary Volume 43 OCR split

on:
  push:
    branches:
      - tmp-volume43-source-render

permissions:
  contents: write
  actions: read

jobs:
  split-ocr:
    if: ${{ !contains(github.event.head_commit.message, '[ocr-split]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-volume43-source-render

      - name: Split cached OCR by physical PDF page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('tmp-source/volume43-pdf279-315-ocr.txt').read_text(encoding='utf-8')
          out=Path('tmp-source/ocr279-315')
          out.mkdir(parents=True,exist_ok=True)
          blocks={int(m.group(1)):m.group(2).strip('\n')+'\n' for m in re.finditer(r'===== PDF (\d+) =====\n(.*?)(?=\n===== PDF \d+ =====|\Z)',src,re.S)}
          assert sorted(blocks)==list(range(279,316)), sorted(blocks)
          for p,t in blocks.items():
              (out/f'page-{p}.txt').write_text(t,encoding='utf-8')
          print('split pages',len(blocks))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-source/ocr279-315/page-*.txt
          git commit -m "Temporary: split Volume 43 OCR 279-315 [ocr-split]"
          git push origin HEAD:tmp-volume43-source-render
