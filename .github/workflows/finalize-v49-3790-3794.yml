name: Finalize Volume 49 translations 3790-3794

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/v49-3790-3794/finalize-trigger.txt

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Decode and run audited batch finalizer
        run: |
          cat .github/v49-3790-3794/finalize.b64.part* | tr -d '\r\n\t ' | base64 -d | gzip -dc > /tmp/finalize-v49-3790-3794.py
          python -m py_compile /tmp/finalize-v49-3790-3794.py
          python /tmp/finalize-v49-3790-3794.py

      - name: Validate and commit
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Translate Volume 49 letters 3790-3794 with scan fidelity audit" -m "Add source-checked English translations for letters 3790–3794 after visually comparing all 39 canonical Tamil Markdown pages (PDF 203–241) with their scans. Apply and document fifteen scan-verified word-boundary, quotation-mark, character-order or paragraph-boundary corrections. Append the complete corrected authoritative Tamil source to every bilingual file, update the English index, glossary, progress record and repository summaries, and remove temporary export and staging files."
          git push origin main
