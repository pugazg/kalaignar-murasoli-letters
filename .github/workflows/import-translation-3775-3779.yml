name: Import translations 3775-3779

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  import:
    if: github.head_ref == 'translation-3775-3779'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: translation-3775-3779
          fetch-depth: 0

      - name: Decode and verify translation payload
        shell: bash
        run: |
          wc -c .translation-batch-3775-3779/chunk-*.txt
          cat .translation-batch-3775-3779/chunk-*.txt > /tmp/payload.b64
          wc -c /tmp/payload.b64
          base64 --decode /tmp/payload.b64 > /tmp/payload.tar.gz
          sha256sum /tmp/payload.tar.gz
          echo "bcac0060f9c6de97665fdb74cdc87708df6fc83ec7f6ae2e74acf72c7164823d  /tmp/payload.tar.gz" | sha256sum -c -
          test "$(tar -tzf /tmp/payload.tar.gz | wc -l)" -eq 19
          tar -xzf /tmp/payload.tar.gz -C .

      - name: Validate source corrections and bilingual files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          page_dir = root / 'volumes/volume-49/pages'
          trans_dir = root / 'volumes/volume-49/translations/en'

          corrections = {
              114: ('“முரசொலி”யில்', '“முரசொலியில்'),
              116: ('ஈடுபட்டதையும்', 'ஈடுபட்ட தையும்'),
              120: ('முதல் அமைச்சருக்கு', 'முதல்அமைச்சருக்கு'),
              121: ('நிறைவேற்றப்பட்டது', 'நிறை வேற்றப்பட்டது'),
              122: ('பிரச்சினைக்கு', 'பிரச் சினைக்கு'),
              124: ('கொண்டதுமான கச்சத்தீவுப்', 'கொண்டதுமானகச்சத்தீவுப்'),
              126: ('வெண்ணெய்க்கும்', 'வெண் ணெய்க்கும்'),
              128: ('ஒரே “பிராண்டை”ச் சேர்ந்த', 'ஒரே “பிராண்டைச் சேர்ந்த'),
          }
          for page, (correct, old) in corrections.items():
              text = (page_dir / f'page-{page:03d}.md').read_text(encoding='utf-8')
              assert correct in text, (page, correct)
              assert old not in text, (page, old)

          specs = {
              3775: ('3775-long-live-the-fame-of-perunthalaivar-kamarajar.md', 101, 106),
              3776: ('3776-our-journey-continues-without-faltering.md', 107, 113),
              3777: ('3777-a-graceful-hair-knot-a-fragrant-screw-pine-flower-they-say.md', 114, 119),
              3778: ('3778-katchatheevu-and-the-trash-question.md', 120, 126),
              3779: ('3779-the-height-of-danger-foreign-direct-investment.md', 127, 131),
          }

          def page_body(page: int) -> str:
              text = (page_dir / f'page-{page:03d}.md').read_text(encoding='utf-8')
              assert text.startswith('---\n')
              end = text.find('\n---\n', 4)
              assert end != -1
              return text[end + 5:].strip()

          mandatory_note = "This translation is intended to carry Kalaignar's voice into clear, contemporary English"
          heading = '## Original Tamil — மூலத் தமிழ்'
          for number, (filename, start, end) in specs.items():
              path = trans_dir / 'letters' / filename
              text = path.read_text(encoding='utf-8')
              assert text.startswith('---\n'), filename
              assert f'letter_number: {number}' in text, filename
              assert text.count('> **Translator’s note**') == 1, filename
              assert text.count(mandatory_note) == 1, filename
              assert text.count(heading) == 1, filename
              assert 'translation_status: "source-checked"' in text, filename
              assert 'source_textual_fidelity_audit: "visual-scan-verified-with-corrections"' in text, filename
              tamil = text.split(heading, 1)[1]
              for page in range(start, end + 1):
                  marker = f'<!-- Source PDF page {page:03d} -->'
                  assert tamil.count(marker) == 1, (filename, marker)
                  body_start = tamil.index(marker) + len(marker)
                  if page < end:
                      next_marker = f'<!-- Source PDF page {page + 1:03d} -->'
                      body_end = tamil.index(next_marker)
                  else:
                      body_end = len(tamil)
                  assert tamil[body_start:body_end].strip() == page_body(page), (filename, page)
              assert text.count('<!-- Source PDF page ') == end - start + 1, filename

          index = (trans_dir / 'README.md').read_text(encoding='utf-8')
          for number, (filename, _, _) in specs.items():
              assert f'[{number}](letters/{filename})' in index, filename

          progress = (trans_dir / 'PROGRESS.md').read_text(encoding='utf-8')
          assert 'Translated: **16**' in progress
          assert 'Source-checked: **16**' in progress
          assert '3780–3784' in progress

          audit = (trans_dir / 'TEXTUAL_FIDELITY_AUDIT_3775_3779.md').read_text(encoding='utf-8')
          assert '31/31' in audit
          assert 'Eight canonical' in audit
          assert 'PDF 101–131' in audit
          PY

      - name: Commit audited batch
        shell: bash
        run: |
          rm -rf .translation-batch-3775-3779
          rm -f .github/workflows/import-translation-3775-3779.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Translate Volume 49 letters 3775-3779 with scan fidelity audit"
          git push origin HEAD:translation-3775-3779
