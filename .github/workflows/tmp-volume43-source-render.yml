name: Temporary Volume 43 OCR cache

on:
  push:
    branches:
      - tmp-volume43-source-render

permissions:
  contents: write
  actions: read

jobs:
  cache-ocr:
    if: ${{ !contains(github.event.head_commit.message, '[ocr-cache]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-volume43-source-render

      - name: Download verified source-render artifact
        uses: actions/download-artifact@v4
        with:
          name: volume43-pdf279-315-verification
          path: source-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: pugazg/kalaignar-murasoli-letters
          run-id: 33531244459

      - name: Cache OCR drafting aid only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp-source
          cp source-artifact/ocr/combined.txt tmp-source/volume43-pdf279-315-ocr.txt
          cp source-artifact/pdfinfo.txt tmp-source/volume43-pdf279-315-pdfinfo.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-source/volume43-pdf279-315-ocr.txt tmp-source/volume43-pdf279-315-pdfinfo.txt
          git commit -m "Temporary: cache Volume 43 OCR 279-315 [ocr-cache]"
          git push origin HEAD:tmp-volume43-source-render
