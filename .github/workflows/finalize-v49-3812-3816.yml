name: Finalize Volume 49 translations 3812-3816
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/v49-3812-3816/finalize-trigger.txt'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Assemble and validate final translation batch
        run: python .github/v49-3812-3816/finalize.py
      - name: Commit batch to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Translate Volume 49 letters 3812-3816 with scan fidelity audit" \
            -m "Add source-checked English translations for the final letters 3812–3816 after visually comparing all 37 canonical Tamil letter pages (PDF 365–401) with their scans. Preserve visible source irregularities without silent emendation, append the complete authoritative Tamil source to every bilingual file, complete the English index and progress records for all 53 letters, update the glossary and repository summaries, and remove temporary export and staging files."
          git push origin HEAD:main
