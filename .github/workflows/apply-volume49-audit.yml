name: Apply Volume 49 audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-volume49-audit.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audit patch and clean temporary files
        shell: bash
        run: |
          base64 --decode .audit-patch.b64 > /tmp/volume49-audit.tar.gz
          tar -xzf /tmp/volume49-audit.tar.gz -C "$GITHUB_WORKSPACE"
          rm -rf .audit-export
          rm -f .audit-artifact-run-id
          rm -f .audit-patch.b64
          rm -f .github/workflows/apply-volume49-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete full audit of volume 49"
          git push origin HEAD:main
